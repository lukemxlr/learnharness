<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-d9BXc+vzu5LpTSZXpehTMW4BSed802o0kNsLdaanrAo='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
	<title>Connect to LearnHarness Server</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #141414;
			--surface: #1d1d1d;
			--border: #303030;
			--text: #ededed;
			--muted: #a1a1aa;
			--accent: #e5e5e5;
			--accent-ink: #141414;
			--error: #f87171;
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		body {
			display: flex;
			flex-direction: column;
		}
		.drag-bar {
			height: 44px;
			-webkit-app-region: drag;
			flex-shrink: 0;
		}
		main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}
		.card {
			width: 100%;
			max-width: 440px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 14px;
			padding: 28px;
		}
		h1 {
			margin: 0 0 8px;
			font-size: 20px;
			font-weight: 600;
		}
		p {
			margin: 0 0 20px;
			font-size: 14px;
			line-height: 1.5;
			color: var(--muted);
		}
		label {
			display: block;
			margin-bottom: 8px;
			font-size: 13px;
			font-weight: 500;
		}
		input {
			width: 100%;
			padding: 10px 12px;
			border-radius: 8px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text);
			font-size: 14px;
			outline: none;
		}
		input:focus {
			border-color: var(--accent);
		}
		.error {
			margin-top: 12px;
			font-size: 13px;
			color: var(--error);
			min-height: 18px;
		}
		.actions {
			margin-top: 20px;
			display: flex;
			gap: 10px;
			justify-content: flex-end;
		}
		button {
			padding: 9px 16px;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			border: 1px solid var(--border);
			background: transparent;
			color: var(--text);
		}
		button[type="submit"] {
			background: var(--accent);
			color: var(--accent-ink);
			border-color: var(--accent);
		}
		button:disabled {
			opacity: 0.6;
			cursor: default;
		}
	</style>
</head>
<body>
	<div class="drag-bar"></div>
	<main>
		<section class="card" aria-labelledby="setup-heading">
			<h1 id="setup-heading">Connect to LearnHarness Server</h1>
			<p>Enter your LearnHarness server URL (HTTPS tunnel or LAN HTTP address).</p>
			<form id="setup-form" novalidate>
				<label for="server-url">Server URL</label>
				<input id="server-url" name="serverUrl" type="url" placeholder="https://learnharness.example.com" autocomplete="url" spellcheck="false" required>
				<div id="error-text" class="error" role="alert" aria-live="polite"></div>
				<div class="actions">
					<button id="cancel-btn" type="button" hidden>Cancel</button>
					<button id="connect-btn" type="submit">Connect</button>
				</div>
			</form>
		</section>
	</main>
	<script>
(() => {
	const form = document.getElementById("setup-form");
	const input = document.getElementById("server-url");
	const errorEl = document.getElementById("error-text");
	const connectBtn = document.getElementById("connect-btn");
	const cancelBtn = document.getElementById("cancel-btn");
	const bridge = window.lhSetup;

	function setError(message) {
		errorEl.textContent = message || "";
	}

	async function hydrate() {
		if (!bridge) return;
		try {
			const state = await bridge.getState();
			if (state && typeof state.serverUrl === "string" && state.serverUrl) {
				input.value = state.serverUrl;
			}
			if (state && state.canCancel) {
				cancelBtn.hidden = false;
			}
			if (state && typeof state.lastError === "string" && state.lastError) {
				setError(state.lastError);
			}
		} catch (err) {
			setError(err && err.message ? err.message : "Could not load server settings.");
		}
		input.focus();
	}

	form.addEventListener("submit", async (event) => {
		event.preventDefault();
		if (!bridge) {
			setError("Setup bridge is unavailable.");
			return;
		}
		setError("");
		connectBtn.disabled = true;
		connectBtn.textContent = "Connecting…";
		try {
			const result = await bridge.saveServerUrl(input.value);
			if (result && result.ok === false) {
				setError(result.error || "Could not connect to the server.");
			}
		} catch (err) {
			setError(err && err.message ? err.message : "Could not connect to the server.");
		} finally {
			connectBtn.disabled = false;
			connectBtn.textContent = "Connect";
		}
	});

	cancelBtn.addEventListener("click", () => {
		if (bridge && typeof bridge.cancel === "function") {
			void bridge.cancel();
		}
	});

	void hydrate();
})();
	</script>
</body>
</html>
